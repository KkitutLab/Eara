[package]
name = "Eara"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
serenity = { version = "0.12.5" , features = ["gateway", "client", "cache"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["mysql", "runtime-tokio", "chrono"] }
once_cell = "1.21.4"
regex = "1.13.0"
serde_json = "1.0.150"